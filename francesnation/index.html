<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Frances Nation - sample product reel</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --text:#eef1f5; --muted:#9aa4b2; --accent:#e8c27a; --line:#262b34; }
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px 16px; }
  .wrap { width:100%; max-width:430px; }
  h1 { font-size:1.35rem; margin:0 0 4px; letter-spacing:-.01em; }
  .lede { color:var(--muted); margin:0 0 18px; font-size:.98rem; }
  .frame { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px; }
  video { display:block; width:100%; border-radius:9px; background:#000; }
  footer { margin-top:18px; color:var(--muted); font-size:.82rem; line-height:1.5; }
  footer .flag { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Frances Nation</h1>
    <p class="lede">A short product reel, made for your Instagram and store. No obligation.</p>
    <div class="frame">
      <video src="reel.mp4" controls autoplay muted loop playsinline preload="metadata"></video>
    </div>
    <footer>
      <div class="flag">Sample reel prepared by Nor'west Digital for Frances Nation. Not affiliated with Frances Nation.</div>
      <div>Made from francesnation.co.nz's own public product images. Reply STOP to opt out of contact.</div>
    </footer>
  </main>
</body>
</html>
